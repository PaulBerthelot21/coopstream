<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "GeistExport";
        src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Black.woff2")
          format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      .root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      .bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Même DA que overlay-scene-chat / intro-rebrand */
      .brand {
        position: absolute;
        left: 3.2%;
        top: 3.3%;
        display: flex;
        flex-direction: column;
        font-family: "GeistExport", system-ui, "Segoe UI", sans-serif;
        font-weight: 900;
        font-style: italic;
        text-transform: uppercase;
        line-height: 0.82;
        letter-spacing: -0.04em;
        color: transparent;
        -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 2.5px rgba(255, 255, 255, 0.92);
        paint-order: stroke fill;
        filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.45));
      }
      .le {
        font-size: 30.4px;
      }
      .calme {
        margin-top: -2px;
        margin-left: 8%;
        font-size: 41.6px;
      }
    </style>
  </head>
  <body>
    <div class="root" id="capture">
      <img class="bg" src="../public/overlays/lecalme-rebrand/scene-chat-bg.jpg" alt="" />
      <div class="brand">
        <span class="le">LE</span>
        <span class="calme">CALME</span>
      </div>
    </div>
  </body>
</html>
